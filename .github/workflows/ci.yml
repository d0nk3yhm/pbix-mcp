name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Power BI is a Windows product and that is where nearly every user runs
    # this, so Windows is a first-class CI target. Testing only on Linux hid a
    # whole class of bug: POSIX happily unlinks a file that still has an open
    # handle, Windows raises WinError 32. Three unclosed SQLite handles made
    # every calculated-column/table edit fail on Windows while CI stayed green.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy (baseline 140 errors, fail if new errors added)
        shell: bash
        run: |
          # The old `| grep -c "error:" || true` swallowed EVERYTHING: a mypy
          # crash, an aborted run, even mypy missing entirely all counted as
          # "0 errors" and the gate passed green. Capture output and exit code
          # separately: mypy exits 0 (clean) or 1 (type errors); anything else
          # is an abnormal run and must fail the gate outright.
          set +e
          OUT=$(mypy src/pbix_mcp/ --ignore-missing-imports --no-error-summary 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 1 ]; then
            echo "FAIL: mypy exited abnormally (status $STATUS)"
            echo "$OUT" | tail -20
            exit 1
          fi
          COUNT=$(printf '%s
' "$OUT" | grep -c "error:" || true)
          echo "mypy errors: $COUNT (baseline: 140)"
          if [ "$COUNT" -gt 140 ]; then
            echo "FAIL: mypy errors ($COUNT) exceed baseline (140)"
            exit 1
          fi

      - name: Run unit tests with coverage
        run: pytest -m "not slow and not integration" -v --tb=short --cov=src/pbix_mcp --cov-report=term-missing --cov-fail-under=22

      - name: Build package
        run: python -m build

      - name: Verify wheel installs cleanly
        shell: bash
        run: |
          pip install dist/*.whl --force-reinstall --no-deps
          python -c "from pbix_mcp.server import mcp; print('Import OK')"
